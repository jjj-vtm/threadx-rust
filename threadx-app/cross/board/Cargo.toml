[package]
name = "board"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# makes `cargo check --all-targets` (used by Rust-Analyzer) work
[lib]
bench = false
doctest = false
test = false


[dependencies]

cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true }
threadx-sys = { workspace = true }
threadx-rs = { workspace = true }
stm32f4xx-hal = { workspace = true }
ssd1306 = "0.10.0"
embedded-hal = "1.0.0"
# Git dependency for embedded-hal 1.0 compatibility
hts221 = { git = "https://github.com/Zelzahn/hts221.git" }


[dev-dependencies]
defmt-test = { workspace = true }

[features]
# these features are required by defmt
defmt-default = []
defmt-trace = []
defmt-debug = []
defmt-info = []
defmt-warn = []
defmt-error = []

